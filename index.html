<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141A28">
  <title>음악 연구소 탈출</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&family=Orbitron:wght@600;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&display=block&text=%F0%9D%84%9E">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <style>
    :root{
      --blue:#4C5A78;--lemon:#EDE28E;--lemon2:#F7F0B8;--cream:#FDFDFE;
      --navy:#141A28;--navy2:#1B2335;--panel:#212A3F;--panel2:#2A3450;
      --line:rgba(237,226,142,.16);--line2:rgba(165,174,196,.22);
      --ink:#EEF0F6;--muted:#A5AEC4;--paperInk:#1E2536;
      --good:#8FE0B0;--bad:#FF9B8F;--shadow:0 22px 60px rgba(0,0,0,.45);--radius:20px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;color:var(--ink);font-family:"Noto Sans KR",sans-serif;background:var(--navy)}
    body{min-height:100dvh;background:
      linear-gradient(rgba(76,90,120,.09) 1px,transparent 1px) 0 0/34px 34px,
      linear-gradient(90deg,rgba(76,90,120,.09) 1px,transparent 1px) 0 0/34px 34px,
      radial-gradient(circle at 15% 0%,#26314b 0,transparent 42%),var(--navy)}
    button,input,select{font:inherit;color:inherit}
    button{min-height:44px;cursor:pointer}
    .app{min-height:100dvh;display:flex;flex-direction:column}
    .shell{width:min(1180px,100%);margin:0 auto;padding:18px clamp(14px,3vw,32px) 40px}
    .scene{animation:enter .35s ease both}
    @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .display{font-family:"Do Hyeon",sans-serif;font-weight:400;letter-spacing:-.01em}
    .eyebrow{font:800 11px Orbitron,sans-serif;letter-spacing:.22em;color:var(--lemon)}

    /* 상단 바 */
    .topbar{position:sticky;top:0;z-index:20;background:rgba(15,20,32,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .topinner{width:min(1180px,100%);margin:auto;min-height:64px;padding:8px clamp(14px,3vw,32px);display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px}
    .brand{font-family:"Do Hyeon";font-size:22px;line-height:1.1}.brand small{display:block;font:800 9px Orbitron;letter-spacing:.22em;color:var(--muted)}
    .steps{display:flex;gap:6px;align-items:center}
    .step{min-width:30px;height:30px;padding:0 8px;border-radius:99px;display:grid;place-items:center;font:700 12px "Noto Sans KR";border:1px solid var(--line2);color:var(--muted)}
    .step.on{border-color:var(--lemon);color:var(--navy);background:var(--lemon)}
    .step.done{border-color:rgba(143,224,176,.5);color:var(--good)}
    .meters{display:flex;gap:8px}
    .meter{border:1px solid var(--line);background:rgba(237,226,142,.07);border-radius:12px;padding:6px 11px;text-align:right;white-space:nowrap}
    .meter span{display:block;font-size:10px;color:var(--muted)}.meter b{font:900 16px "Noto Sans KR";color:var(--lemon2)}
    .meter.over b{color:var(--bad)}

    /* 버튼 */
    .primary,.secondary{border:0;border-radius:14px;padding:13px 20px;font-weight:700;transition:transform .15s,background .15s}
    .primary{background:var(--lemon);color:var(--navy);box-shadow:0 10px 26px rgba(237,226,142,.18)}
    .primary:hover:not(:disabled),.secondary:hover{transform:translateY(-2px)}
    .primary:disabled{opacity:.4;cursor:not-allowed}
    .secondary{background:var(--panel2);border:1px solid var(--line2)}
    .text-btn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px;min-height:36px}
    .action-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}

    /* 타이틀 */
    .hero{position:relative;min-height:calc(100dvh - 36px);border-radius:26px;overflow:hidden;display:grid;align-items:end;box-shadow:var(--shadow);isolation:isolate}
    .hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
    .hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(10,14,24,.92) 0%,rgba(10,14,24,.6) 50%,rgba(10,14,24,.15)),linear-gradient(0deg,rgba(10,14,24,.9),transparent 60%)}
    .hero-copy{padding:clamp(24px,6vw,72px);max-width:760px}
    .hero h1{font-family:"Do Hyeon";font-weight:400;font-size:clamp(46px,8vw,92px);line-height:1;margin:14px 0 16px;text-shadow:0 6px 30px #000}
    .hero h1 span{display:block;color:var(--lemon)}
    .lede{font-size:clamp(15px,2vw,19px);line-height:1.75;color:#D6DCEA;max-width:600px;margin:0}
    .rule-card{margin-top:22px;background:rgba(20,26,40,.86);border:1px solid var(--line);border-radius:18px;padding:16px 18px;max-width:600px}
    .rule-card p{margin:0 0 10px;color:var(--muted);font-size:14px}.rule-card p b{color:var(--lemon2)}

    /* 계이름 번호표 */
    .solfa{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .solfa>*{background:var(--cream);color:var(--paperInk);border-radius:10px;padding:8px 2px;text-align:center;border:2px solid transparent}
    .solfa b{display:block;font-size:15px}.solfa span{display:block;font:900 20px "Noto Sans KR";color:var(--blue)}
    button.solfa-btn{min-height:64px}
    button.solfa-btn:hover{border-color:var(--lemon);transform:translateY(-2px)}
    .solfa.mini>*{padding:5px 0;border-radius:8px}.solfa.mini b{font-size:12px}.solfa.mini span{font-size:14px}

    /* 공통 패널 */
    .panel{background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);box-shadow:var(--shadow)}
    .grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
    .field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px}
    .field input,.field select{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line2);background:var(--navy2);padding:10px 13px}
    .field input:focus,.field select:focus{outline:2px solid rgba(237,226,142,.5);border-color:var(--lemon)}
    .form-grid{display:grid;grid-template-columns:.8fr .8fr .8fr 1.6fr;gap:10px;margin:18px 0}

    /* 마에스트로 */
    .maestro{display:flex;gap:14px;align-items:flex-start}
    .maestro .ava{flex:0 0 auto;width:78px;height:78px;border-radius:50%;background:var(--cream);overflow:hidden;border:3px solid var(--lemon);box-shadow:0 0 24px rgba(237,226,142,.35)}
    .maestro .ava img{width:100%;height:100%;object-fit:cover}
    .bubble{background:rgba(20,26,40,.9);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:13px 16px;line-height:1.65}
    .bubble>b{display:block;color:var(--lemon);font:800 10px Orbitron;letter-spacing:.2em;margin-bottom:4px}
    .bubble p{margin:0}.bubble p b{color:var(--lemon2)}
    .maestro.big .ava{width:120px;height:120px}

    /* 방 */
    .room-hero{position:relative;min-height:clamp(210px,28vw,300px);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(16px,3vw,26px);box-shadow:var(--shadow);isolation:isolate}
    .room-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
    .room-hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(12,16,26,.92),rgba(12,16,26,.25) 70%),linear-gradient(90deg,rgba(12,16,26,.7),transparent 60%)}
    .room-hero h1{font-family:"Do Hyeon";font-weight:400;font-size:clamp(32px,5vw,50px);margin:4px 0 0;text-shadow:0 4px 18px #000}
    .room-hero .maestro{max-width:640px}
    .room-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;margin-top:18px;align-items:start}
    .puzzles{display:flex;flex-direction:column;gap:14px}
    .card{background:var(--cream);color:var(--paperInk);border-radius:18px;padding:18px 20px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
    .card h3{margin:0 0 4px;font-size:18px}.card p{margin:0;line-height:1.6}
    .qno{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--blue);color:var(--cream);font:900 15px "Noto Sans KR";margin-right:8px;vertical-align:middle;flex:0 0 auto}
    .cards-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .tagq{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:24px;position:relative}
    .tagq .qno{position:absolute;left:14px;top:14px}
    .tagq small{color:#5B6480;font-size:14px}
    .nametag{position:relative;background:var(--lemon2);border:2px solid #C9BB5E;border-radius:10px 10px 10px 10px;padding:12px 30px 12px 40px;font-family:"Do Hyeon";font-size:42px;line-height:1;box-shadow:0 5px 0 #C9BB5E}
    .nametag:before{content:"";position:absolute;left:14px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--cream);border:2px solid #C9BB5E}
    .qline{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:62px}
    .glyph{display:inline-flex;align-items:center;justify-content:center;width:50px;height:60px;background:#F1F3F8;border-radius:10px}
    .glyph svg{width:44px;height:54px}
    .op{font:900 22px "Noto Sans KR";color:var(--blue);padding:0 2px}
    .ans-slot{margin-left:auto;font-family:"Do Hyeon";font-size:22px;color:var(--blue);white-space:nowrap}
    .measures{display:flex;align-items:stretch;overflow-x:auto;padding:6px 0 4px;margin-top:10px}
    .timesig{display:flex;flex-direction:column;justify-content:center;font:900 22px/0.95 "Noto Sans KR";padding:0 12px 0 4px;color:var(--paperInk);border-right:3px solid var(--paperInk)}
    .measure{display:flex;flex-direction:column;align-items:center;padding:0 10px;border-right:3px solid var(--paperInk);min-width:max-content}
    .measure:last-child{border-right-width:6px}
    .measure .mno{font:800 18px "Noto Sans KR";color:var(--blue);margin-bottom:4px}
    .measure .row{display:flex;gap:3px}
    .measure .glyph{width:40px;height:52px;background:transparent}
    .measure .glyph svg{width:36px;height:46px}
    .staff-wrap{overflow-x:auto;background:var(--lemon2);border-radius:14px;padding:6px 4px;box-shadow:inset 0 0 0 2px #D8CB70,0 0 34px rgba(237,226,142,.25)}
    .staff-wrap svg{display:block;width:100%;min-width:600px;height:auto}
    .staff-wrap.small svg{min-width:0}
    .clef{font-family:"Noto Music",serif}
    .note-key{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
    .note-key div{background:#EEF1F7;border-radius:10px;padding:8px;text-align:center;font-size:14px;color:#4A5370}
    .note-key b{font:900 16px "Noto Sans KR";color:var(--blue);margin-right:4px}
    .practice{border:2px dashed var(--blue);background:#F4F6FB}
    .choice-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .choice{flex:1 1 90px;min-height:52px;border-radius:12px;border:2px solid #CDD3E1;background:var(--cream);color:var(--paperInk);font-family:"Do Hyeon";font-size:22px}
    .choice:hover{border-color:var(--blue)}
    .explain{margin-top:12px;background:#E8F7EE;border-left:4px solid #3E9E6B;border-radius:8px;padding:10px 14px;line-height:1.6;color:#1F4D35}
    .keycards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
    .keycard{border:3px solid #D6DBE7;background:var(--cream);border-radius:14px;padding:8px;color:var(--paperInk)}
    .keycard:hover:not(:disabled){border-color:var(--blue)}
    .keycard.picked{border-color:#3E9E6B;background:#EFFAF3}
    .keycard strong{display:block;font:900 16px "Noto Sans KR";color:var(--blue);margin-top:4px}
    .keycard .staff-wrap{background:transparent;box-shadow:none;padding:0}
    .locked-note{padding:18px;border-radius:14px;background:#EEF1F7;color:#5B6480;text-align:center}

    /* 자물쇠 패널 */
    .lock{position:sticky;top:80px;padding:18px;display:flex;flex-direction:column;gap:14px}
    .lock-head{display:flex;justify-content:space-between;align-items:baseline}
    .lock-head h2{margin:0;font-family:"Do Hyeon";font-weight:400;font-size:24px}
    .lock-head span{font-size:12px;color:var(--muted)}.lock-head span b{font:900 15px "Noto Sans KR";color:var(--lemon2)}
    .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .slot{position:relative;font-variant-numeric:tabular-nums;height:74px;border-radius:14px;background:#0F1422;border:2px solid var(--line2);display:grid;place-items:center;font:900 34px "Noto Sans KR";color:var(--lemon)}
    .slot.cur{border-color:var(--lemon);box-shadow:0 0 0 3px rgba(237,226,142,.15)}
    .slot small{position:absolute;top:4px;left:8px;font:700 11px "Noto Sans KR";color:var(--muted)}
    .slots.shake{animation:shake .35s}
    @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
    .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .keypad button{min-height:56px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font:900 22px "Noto Sans KR"}
    .keypad button:hover:not(:disabled){border-color:var(--lemon)}
    .keypad button.fn{font:700 14px "Noto Sans KR";color:var(--muted)}
    .keypad button:disabled,.open-btn:disabled{opacity:.35;cursor:not-allowed}
    .open-btn{width:100%;font-size:18px;min-height:56px}
    .status{min-height:22px;font-size:14px;color:var(--muted);text-align:center;line-height:1.5}
    .status.bad{color:var(--bad)}.status.lockdown{color:var(--bad);font-weight:700}
    .hints{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .hint-btn{border-radius:12px;border:1px dashed rgba(237,226,142,.45);background:rgba(237,226,142,.06);color:var(--lemon2);font-size:13px;padding:8px;line-height:1.35}
    .hint-btn small{display:block;color:var(--muted)}
    .hint-btn:disabled{opacity:.45;cursor:not-allowed}
    .hint-out{background:rgba(237,226,142,.09);border-left:3px solid var(--lemon);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.6;color:#E9E3B8}
    .tried{display:flex;flex-wrap:wrap;gap:6px}
    .tried span{font:900 12px "Noto Sans KR";color:var(--muted);text-decoration:line-through;border:1px solid var(--line2);border-radius:99px;padding:4px 9px}
    .giveup{text-align:center}

    /* 로비 */
    .lobby{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px;margin-top:10px}
    .lobby .panel{padding:clamp(18px,3vw,28px)}
    .lobby h2{font-family:"Do Hyeon";font-weight:400;font-size:30px;margin:6px 0 10px}
    .lobby p{color:var(--muted);line-height:1.7}
    .practice-q{margin-top:18px;padding:16px;border-radius:14px;background:rgba(237,226,142,.08);border:1px solid var(--line)}
    .practice-q h3{margin:0 0 12px;font-size:18px}

    /* 결말 */
    .ending-wrap{max-width:920px;margin:10px auto}
    .end-hero{position:relative;min-height:340px;border-radius:22px 22px 0 0;overflow:hidden;display:flex;align-items:flex-end;padding:clamp(18px,4vw,34px);isolation:isolate}
    .end-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
    .end-hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(12,16,26,.92),rgba(12,16,26,.1) 75%)}
    .end-hero.dark>img{filter:grayscale(.7) brightness(.45)}
    .end-hero h1{font-family:"Do Hyeon";font-weight:400;font-size:clamp(34px,6vw,58px);margin:6px 0 12px;text-shadow:0 4px 18px #000}
    .result-body{padding:clamp(18px,4vw,32px);border-radius:0 0 22px 22px}
    .result-card{border-radius:22px;background:var(--panel);box-shadow:var(--shadow);border:1px solid var(--line2)}
    .score-big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
    .score-big strong{font:900 64px "Noto Sans KR";color:var(--lemon)}
    .score-big span{color:var(--muted)}
    .score-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
    .score-grid div{background:var(--navy2);border:1px solid var(--line2);border-radius:14px;padding:13px}
    .score-grid span{display:block;font-size:12px;color:var(--muted)}
    .score-grid b{display:block;font:900 20px "Noto Sans KR";margin-top:4px}
    .root-note{display:flex;align-items:center;gap:14px;margin-top:6px}
    .root-note .staff-wrap{width:190px;flex:0 0 auto}
    .send-box{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--navy2);border:1px solid var(--line2);line-height:1.6}
    .send-box.err{background:#3A1E26;border-color:#A95C61}
    .send-box.ok{border-color:rgba(143,224,176,.45)}
    .spinner{display:inline-block;width:16px;height:16px;border:3px solid #34405C;border-top-color:var(--lemon);border-radius:50%;animation:spin 1s linear infinite;vertical-align:-3px;margin-right:8px}
    @keyframes spin{to{rotate:360deg}}

    .toast{position:fixed;left:50%;bottom:24px;z-index:80;translate:-50% 30px;background:var(--cream);color:var(--paperInk);border-radius:13px;padding:12px 18px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;max-width:min(560px,90vw);text-align:center;line-height:1.5}
    .toast.show{opacity:1;translate:-50% 0}.toast.bad{background:#4A2026;color:#FFE4E0}.toast.good{background:#183F32;color:#D9FFEC}

    @media(max-width:960px){
      .room-grid,.lobby{grid-template-columns:minmax(0,1fr)}
      .lock{position:static}
      .steps{display:none}.topinner{grid-template-columns:1fr auto}
    }
    @media(max-width:640px){
      .shell{padding-left:12px;padding-right:12px}
      .hero{border-radius:0;min-height:100dvh;margin:-18px -12px 0}
      .cards-2,.grid-2{grid-template-columns:minmax(0,1fr)}
      .form-grid{grid-template-columns:1fr 1fr}.form-grid .field:last-child{grid-column:1/-1}
      .score-grid{grid-template-columns:1fr 1fr}
      .keycards{grid-template-columns:1fr}
      .maestro .ava{width:58px;height:58px}
      .brand{font-size:18px}.meter{padding:5px 8px}.meter b{font-size:14px}
      .note-key{grid-template-columns:1fr 1fr}
    }
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    // Apps Script 웹 앱을 배포한 뒤 /exec 주소를 아래에 붙여 넣으세요.
    // 비워 두면 GitHub Pages/로컬에서 목 모드로 전체 흐름을 시험할 수 있습니다.
    const SUBMIT_URL = '';
    const SAVE_KEY = 'musicLabEscapeStateV1';
    const PENDING_KEY = 'musicLabEscapePendingSubmissionV1';
    const TIME_LIMIT = 25 * 60;
    const asset = name => 'assets/img/' + name;

    // 비밀번호는 평문 대신 해시로만 비교합니다. (scripts/make-hashes.mjs로 생성)
    const SALT = 'maestro-lab|';
    const LOCK_HASHES = new Set(["193b9npgw99","1fum14xilkt","1gonxg43ey6","1rhiqpbwq85","1stik48bcl1","1wf2siaswqo","24sy625jcr2","26arama4pfo","27bcxbqy4z2","28msxdrjab5","2ar8psvqoju","2brojzvrlr0","2g28h83269f","2gg1xb8kxr6","2gkjwk6vu4t","33fzzlndl7","4xpdmfj62j","7pqrbv7wk3","b83jv3y4vv","c8i0ouwnk5","hgmpx082uw","pxva5nrls","svz5vk63h2"]);
    function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
    const matches = key => LOCK_HASHES.has(cyrb53(SALT + key));

    const SOLFA = [['도',1],['레',2],['미',3],['파',4],['솔',5],['라',6],['시',7]];
    const ROOMS = {

         hint:"바장조에서 첫째(도)는 누구였죠? 음이름 '바'부터 도·레·미… 세어 보세요.",
         done:"서랍장이 정리됐습니다. 바장조에서는 '바'가 도예요."},
      2:{title:'리듬 계산실',img:'room2.webp',say:'박이 맞아야 기어가 돌아갑니다. <b>4분음표 = 1박</b>으로 계산해 주세요.',

         hint:"악보 맨 앞의 ♭을 보세요. 이 곡은 무슨 장조이고, 누가 '도'인가요?",
         done:'암호 벽이 열립니다. 조표 ♭ 때문에 셋째 줄 음은 내림나였죠.'},
      4:{title:'으뜸음 금고',img:'room4.webp',say:'마지막 금고입니다. <b>두 단계 잠금</b>을 모두 풀어야 열려요.',
         hint:'덧줄 음은 첫째 줄 아래로 한 칸씩 내려가며 세요. 첫째 줄(마) → 그 아래(라) → 덧줄(다).',

    const newRoom = () => ({input:'',wrong:0,wrongPins:[],streak:0,lockUntil:0,hint1:null,hint2:false,keyWrong:0,keyDone:false,practiceDone:false,startedAt:0,clearedAt:0});
    const initialState = () => ({scene:'title',student:{grade:'6',className:'',number:'',name:''},practiceDone:false,startedAt:0,endedAt:0,escaped:false,rooms:{1:newRoom(),2:newRoom(),3:newRoom(),4:newRoom()},keyOrder:shuffle(['A','B','C']),giveupArmed:false,result:null,sendError:''});
    function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

    function loadState(){
      try{
        if(new URLSearchParams(location.search).has('reset')){localStorage.removeItem(SAVE_KEY);localStorage.removeItem(PENDING_KEY);history.replaceState(null,'',location.pathname)}
        const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
        if(!saved)return initialState();
        const base=initialState();
        const merged=Object.assign(base,saved);
        [1,2,3,4].forEach(n=>merged.rooms[n]=Object.assign(newRoom(),(saved.rooms||{})[n]||{}));

      }catch(e){return initialState()}
    }
    function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}
    let state = loadState();

    /* ── 점수 ── */
    function roomDeduction(r){return Math.min(40,r.wrong*10)+(r.hint1?10:0)+(r.hint2?20:0)+r.keyWrong*10}
    function roomScore(n,tentative=false){const r=state.rooms[n];if(!r.clearedAt&&!tentative)return 0;return Math.max(0,100-roomDeduction(r))}
    function elapsedSeconds(){if(!state.startedAt)return 0;return Math.round(((state.endedAt||Date.now())-state.startedAt)/1000)}
    function timeBonus(){if(!state.escaped)return 0;const left=TIME_LIMIT-elapsedSeconds();return left>0?Math.min(50,Math.floor(left/60)*2):0}
    function earned(){return [1,2,3,4].reduce((s,n)=>s+roomScore(n),0)}
    function fmt(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}

    /* ── 음표·쉼표 SVG (음표길이 워크시트와 같은 모양) ── */
    const B='#2B3242';
    function head(x,y,filled){return `<ellipse cx="${x}" cy="${y}" rx="7" ry="5" transform="rotate(-20 ${x} ${y})" fill="${filled?B:'none'}" stroke="${B}" stroke-width="2"/>`}
    function stem(x,y){return `<line x1="${x+6}" y1="${y-1}" x2="${x+6}" y2="${y-26}" stroke="${B}" stroke-width="2"/>`}
    function flag(x,y,n){let s='';for(let i=0;i<n;i++){const t=y-26+i*7;s+=`<path d="M${x+6},${t} q10,4 8,16" fill="none" stroke="${B}" stroke-width="2.5"/>`}return s}
    function dot(x,y){return `<circle cx="${x+13}" cy="${y-1}" r="2.2" fill="${B}"/>`}
    function noteSVG(type){const x=12,y=34;let g='';switch(type){case 'w':g=head(x,y,false);break;case 'h':g=head(x,y,false)+stem(x,y);break;case 'hd':g=head(x,y,false)+stem(x,y)+dot(x,y);break;case 'q':g=head(x,y,true)+stem(x,y);break;case 'qd':g=head(x,y,true)+stem(x,y)+dot(x,y);break;case 'e':g=head(x,y,true)+stem(x,y)+flag(x,y,1);break}return `<svg viewBox="0 0 34 42" aria-hidden="true">${g}</svg>`}
    function restSVG(type){const L=`<line x1="2" y1="20" x2="32" y2="20" stroke="#B5BDCF" stroke-width="1.5"/>`;let g='';switch(type){case 'w':g=`<rect x="11" y="20" width="12" height="5" fill="${B}"/>`;break;case 'h':g=`<rect x="11" y="15" width="12" height="5" fill="${B}"/>`;break;case 'q':g=`<path d="M14,8 l6,7 l-5,6 l6,8 q-6,-3 -6,2" fill="none" stroke="${B}" stroke-width="2.5" stroke-linejoin="round"/>`;break;case 'e':g=`<circle cx="13" cy="14" r="2.5" fill="${B}"/><path d="M13,14 q6,3 9,-1 l-5,17" fill="none" stroke="${B}" stroke-width="2.2"/>`;break}return `<svg viewBox="0 0 34 42" aria-hidden="true">${L}${g}</svg>`}
    const NAMES={w:'온',h:'2분',hd:'점2분',q:'4분',qd:'점4분',e:'8분'};
    function glyph(code){const [kind,type]=code.split(':');const label=(NAMES[type]||'')+(kind==='r'?'쉼표':'음표');return `<span class="glyph" role="img" aria-label="${label}">${kind==='r'?restSVG(type):noteSVG(type)}</span>`}

    /* ── 오선 SVG (높은음자리표, 음 위치 p: 첫째 줄=0, 첫째 칸=1 … 아래 덧줄=-2) ── */
    const INK='#1E2536';
    function staffSVG({notes=[],key='C',w=640,labels=false,barline=true}={}){
      const s=14,top=labels?54:26,bot=top+4*s,h=bot+40,Y=p=>bot-p*s/2;
      let g='';
      for(let i=0;i<5;i++)g+=`<line x1="8" x2="${w-8}" y1="${top+i*s}" y2="${top+i*s}" stroke="${INK}" stroke-width="1.5"/>`;
      g+=`<text class="clef" x="12" y="${Y(2)}" font-size="${s*4.2}" fill="${INK}">𝄞</text>`;
      if(key==='F')g+=flatSign(66,Y(4));
      if(key==='G')g+=sharpSign(68,Y(8));
      if(barline)g+=`<line x1="${w-8}" x2="${w-8}" y1="${top}" y2="${bot}" stroke="${INK}" stroke-width="3"/>`;
      const start=notes.length>1?150:w/2+20,gap=notes.length>1?(w-start-70)/(notes.length-1):0;
      notes.forEach((n,i)=>{
        const x=start+i*gap,y=Y(n.p);
        for(let q=-2;q>=n.p;q-=2)g+=`<line x1="${x-15}" x2="${x+15}" y1="${Y(q)}" y2="${Y(q)}" stroke="${INK}" stroke-width="1.8"/>`;
        if(n.mark)g+=`<circle cx="${x}" cy="${y}" r="17" fill="rgba(76,90,120,.18)" stroke="#4C5A78" stroke-width="2" stroke-dasharray="4 3"/>`;
        g+=n.p<4?`<line x1="${x+7.6}" y1="${y-1}" x2="${x+7.6}" y2="${y-46}" stroke="${INK}" stroke-width="2"/>`:`<line x1="${x-7.6}" y1="${y+1}" x2="${x-7.6}" y2="${y+46}" stroke="${INK}" stroke-width="2"/>`;
        g+=`<ellipse cx="${x}" cy="${y}" rx="8.8" ry="6.3" transform="rotate(-20 ${x} ${y})" fill="${n.fill||INK}"/>`;
        if(labels)g+=`<circle cx="${x}" cy="20" r="13" fill="#4C5A78"/><text x="${x}" y="25.5" text-anchor="middle" font-family="Noto Sans KR,sans-serif" font-weight="900" font-size="15" fill="#FDFDFE">${i+1}</text>`;
      });
      return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="오선 악보">${g}</svg>`;
    }
    function flatSign(x,y){return `<path d="M${x} ${y-25} V${y+8} C${x+5} ${y+4} ${x+13} ${y} ${x+12} ${y-5} C${x+11} ${y-10} ${x+4} ${y-9} ${x} ${y-3}" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>`}
    function sharpSign(x,y){return `<g stroke="${INK}"><line x1="${x-3.5}" y1="${y-17}" x2="${x-3.5}" y2="${y+15}" stroke-width="1.7"/><line x1="${x+3.5}" y1="${y-15}" x2="${x+3.5}" y2="${y+17}" stroke-width="1.7"/><line x1="${x-8}" y1="${y-3}" x2="${x+8}" y2="${y-8}" stroke-width="4.2"/><line x1="${x-8}" y1="${y+8}" x2="${x+8}" y2="${y+3}" stroke-width="4.2"/></g>`}

    /* ── 공통 UI ── */
    function toast(message,type=''){const el=document.getElementById('toast');el.textContent=message;el.className='toast show '+type;clearTimeout(toast._t);toast._t=setTimeout(()=>el.className='toast',2600)}
    function escapeHtml(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

    /* ── 타이틀·로비 ── */
    function renderTitle(){return layout(`<section class="hero"><img src="${asset('title.webp')}" alt="정전된 음악 연구소 복도 끝의 금고 문"><div class="hero-copy"><div class="eyebrow">6학년 음악 · 3단원 복습 방탈출</div><h1>음악 연구소 탈출<span>사라진 으뜸음</span></h1><p class="lede">견학 도중 정전! 관리 AI ‘마에스트로’가 말한다. “누군가 바장조 음계에서 <b>으뜸음</b>을 훔쳐 갔어요. 방마다 걸린 숫자 자물쇠를 풀고 으뜸음을 되찾아 주세요.”</p><div class="rule-card"><p><b>탈출 규칙</b> · 모든 자물쇠 비밀번호는 <b>계이름 번호</b> 또는 <b>박 수</b>입니다.</p>${solfaTable()}</div><div class="action-row"><button class="primary" onclick="setScene('lobby')">연구소 입장하기 →</button></div></div></section>`,true)}
    function renderLobby(){
      const s=state.student;

      return layout(`<section class="lobby"><div class="panel">${maestro('비상 전원으로 연결되었습니다. 저는 연구소 관리 AI <b>마에스트로</b>입니다. 모든 문의 비밀번호는 <b>계이름 번호</b> 아니면 <b>박 수</b>예요.',true)}<div style="margin-top:18px">${solfaTable()}</div></div>${form}</section>`);

    function saveStudent(){const v={grade:document.getElementById('grade').value,className:document.getElementById('className').value.trim(),number:document.getElementById('number').value.trim(),name:document.getElementById('studentName').value.trim()};if(!v.className||!v.number||!v.name)return toast('반, 번호, 이름을 모두 입력해 주세요.','bad');state.student=v;save();setScene('briefing')}
    function renderBriefing(){
      return layout(`<section class="lobby"><div class="panel">${maestro(`${escapeHtml(state.student.name)} 견학생, 반가워요. 방마다 문제 4개를 풀면 <b>4자리 비밀번호</b>가 나옵니다. 틀려도 어느 자리가 틀렸는지는 알려 드릴 수 없어요. 제한 시간은 <b>25분</b>, 빨리 나올수록 보너스가 있습니다.`,true)}<div class="practice-q"><div class="eyebrow">연습 문제 · 점수 없음</div><h3>다장조에서 음이름 ‘사’의 계이름 번호는? 번호표를 눌러 답하세요.</h3><div class="solfa">${SOLFA.map(([n,d])=>`<button class="solfa-btn" onclick="answerPractice('${d}')"><b>${n}</b><span>${d}</span></button>`).join('')}</div>${state.practiceDone?`<div class="explain">정답! 다장조는 ‘다’가 도예요. 다(도)·라(레)·마(미)·바(파)·<b>사(솔)</b> → 5</div>`:''}</div></div><div class="panel"><div class="eyebrow">SCORE RULES</div><h2>점수 규칙</h2><p>방마다 100점, 4개 방 400점에 시간 보너스 최대 50점.</p><ul style="line-height:1.9;color:var(--muted);padding-left:20px;margin:0"><li>비밀번호 오답 1회 −10점 (방마다 최대 −40점)</li><li>3번 연속 틀리면 30초 잠금</li><li>자리 검사기(몇 자리 맞았는지) −10점</li><li>선생님 쪽지(개념 힌트) −20점</li><li>25분 안에 탈출하면 남은 1분당 +2점</li></ul><div class="action-row"><button class="primary" ${state.practiceDone?'':'disabled'} onclick="enterRoom(1)">1번 방으로 →</button></div></div></section>`);
    }
    function answerPractice(d){if(matches('p0:'+d)){state.practiceDone=true;save();toast('정답! 이제 연구소 안으로 들어갑니다.','good');render()}else toast("다장조에서는 '다'가 도예요. 다·라·마·바·사… 세어 보세요.",'bad')}
    function enterRoom(n){const r=state.rooms[n];if(!state.startedAt)state.startedAt=Date.now();if(!r.startedAt)r.startedAt=Date.now();state.giveupArmed=false;setScene('room'+n)}

    /* ── 방 공통 ── */
    function roomShell(n,puzzles){
      const R=ROOMS[n];
      return layout(`<section><div class="room-hero"><img src="${asset(R.img)}" alt=""><div><div class="eyebrow">ROOM 0${n}</div><h1>${R.title}</h1></div>${maestro(R.say)}</div><div class="room-grid"><div class="puzzles">${puzzles}</div>${lockPanel(n)}</div></section>`);
    }
    function lockReady(n){const r=state.rooms[n];if(n===3)return r.practiceDone;if(n===4)return r.keyDone;return true}
    function lockPanel(n){
      const r=state.rooms[n],ready=lockReady(n),locked=r.lockUntil>Date.now();
      const dis=!ready||locked;
      const slots=[0,1,2,3].map(i=>`<div class="slot ${i===r.input.length&&!dis?'cur':''}"><small>${i+1}</small>${r.input[i]||''}</div>`).join('');
      let status='';
      if(!ready)status=n===3?'먼저 연습 문제를 풀면 자물쇠가 켜집니다.':'1단계 조표 잠금을 먼저 푸세요.';
      else if(locked)status=`3번 연속 오답! <span id="lockLeft">${Math.ceil((r.lockUntil-Date.now())/1000)}</span>초 동안 잠겼습니다.`;
      else if(r.wrong)status=`오답 ${r.wrong}회 · 어느 자리가 틀렸는지는 비공개`;
      else status='문제 ①~④의 답을 차례로 입력하세요.';
      const keys=['1','2','3','4','5','6','7','8','9','지움','0','⌫'];
      const hint1=r.hint1?`<div class="hint-out">자리 검사기: <b>${r.hint1.pin}</b> → <b>${r.hint1.count}자리</b> 맞음</div>`:'';
      const hint2=r.hint2?`<div class="hint-out">선생님 쪽지: ${ROOMS[n].hint}</div>`:'';
      return `<aside class="panel lock" aria-label="숫자 자물쇠"><div class="lock-head"><h2>숫자 자물쇠</h2><span>이 방 점수 <b>${roomScore(n,true)}</b></span></div><div id="slots" class="slots">${slots}</div><div class="status ${locked?'lockdown':r.wrong?'bad':''}">${status}</div><div class="keypad">${keys.map(k=>`<button ${dis?'disabled':''} class="${k.length>1&&k!=='⌫'?'fn':''}" onclick="pressKey('${k}')" aria-label="${k}">${k}</button>`).join('')}</div><button class="primary open-btn" ${dis||r.input.length<4?'disabled':''} onclick="tryUnlock()">자물쇠 열기</button>${r.wrongPins.length?`<div class="tried" aria-label="틀린 비밀번호">${r.wrongPins.map(p=>`<span>${p}</span>`).join('')}</div>`:''}<div class="hints"><button class="hint-btn" ${r.hint1||dis?'disabled':''} onclick="useHint1()">자리 검사기<small>지금 입력한 4자리 · −10점</small></button><button class="hint-btn" ${r.hint2?'disabled':''} onclick="useHint2()">선생님 쪽지<small>개념 힌트 · −20점</small></button></div>${hint1}${hint2}${solfaTable(true)}<div class="giveup"><button class="text-btn" onclick="giveUp()">${state.giveupArmed?'한 번 더 누르면 지금까지 기록을 제출합니다':'탈출 중단하고 기록 제출'}</button></div></aside>`;
    }
    function pressKey(k){
      const n=currentRoom();if(!n)return;const r=state.rooms[n];
      if(r.clearedAt||!lockReady(n)||r.lockUntil>Date.now())return;
      if(k==='⌫')r.input=r.input.slice(0,-1);else if(k==='지움')r.input='';else if(r.input.length<4)r.input+=k;
      save();render();
    }
    function tryUnlock(){
      const n=currentRoom();const r=state.rooms[n];
      if(r.clearedAt||!lockReady(n)||r.lockUntil>Date.now())return;
      if(r.input.length<4)return toast('4자리를 모두 입력하세요.','bad');
      if(matches(`r${n}:${r.input}`)){
        r.clearedAt=Date.now();r.streak=0;
        if(n===4){state.escaped=true;state.endedAt=r.clearedAt;save();toast(ROOMS[4].done,'good');setTimeout(()=>setScene('ending'),900);return}
        save();toast(ROOMS[n].done,'good');render();setTimeout(()=>enterRoom(n+1),1100);return;
      }
      r.wrong++;r.streak++;if(r.wrongPins.length<30)r.wrongPins.push(r.input);r.input='';
      if(r.streak>=3){r.streak=0;r.lockUntil=Date.now()+30000;toast('3번 연속 오답! 30초 동안 자물쇠가 잠깁니다.','bad')}
      else toast(r.wrong<=4?'비밀번호가 맞지 않습니다. −10점':'비밀번호가 맞지 않습니다. (이 방 오답 감점은 최대 −40점)','bad');
      save();render();const el=document.getElementById('slots');if(el)el.classList.add('shake');
    }
    function useHint1(){
      const n=currentRoom();const r=state.rooms[n];if(r.hint1)return;
      if(r.input.length<4)return toast('먼저 4자리를 입력한 뒤 검사기를 쓰세요.','bad');
      const count=[...r.input].filter((d,i)=>matches(`r${n}:${i}:${d}`)).length;
      r.hint1={pin:r.input,count};save();toast(`${count}자리가 맞았습니다. (어느 자리인지는 비밀)`);render();
    }
    function useHint2(){const n=currentRoom();const r=state.rooms[n];if(r.hint2)return;r.hint2=true;save();render()}
    function giveUp(){if(!state.giveupArmed){state.giveupArmed=true;save();render();setTimeout(()=>{if(state.giveupArmed){state.giveupArmed=false;save();if(currentRoom())render()}},4000);return}state.giveupArmed=false;state.escaped=false;state.endedAt=Date.now();save();setScene('ending')}

    /* ── 1번 방 ── */
    function renderRoom1(){
      const qs=['가','다','내림나','마'];
      return roomShell(1,`<div class="cards-2">${qs.map((q,i)=>`<article class="card tagq"><span class="qno">${i+1}</span><small>바장조에서 음이름</small><div class="nametag">${q}</div><small>의 계이름 번호는?</small></article>`).join('')}</div>`);
    }
    /* ── 2번 방 ── */
    function renderRoom2(){
      const rows=[['n:qd','n:e','n:h'],['n:hd','r:q','n:e','n:e'],['n:w','n:qd','n:e','r:e','n:e']];
      const measures=[['n:h','n:q','n:q'],['n:qd','n:e','n:h'],['n:q','n:e','n:e','r:q','n:h'],['n:hd','n:q']];
      return roomShell(2,`${rows.map((row,i)=>`<article class="card"><div class="qline"><span class="qno">${i+1}</span>${row.map(glyph).join('<span class="op">+</span>')}<span class="ans-slot">= ? 박</span></div></article>`).join('')}<article class="card"><div style="display:flex;align-items:center"><span class="qno">4</span><h3>틀린 마디 찾기 — 4/4박자에서 박이 맞지 않는 마디의 번호는?</h3></div><div class="measures"><div class="timesig"><span>4</span><span>4</span></div>${measures.map((m,i)=>`<div class="measure"><span class="mno">${'①②③④'[i]}</span><div class="row">${m.map(glyph).join('')}</div></div>`).join('')}</div></article>`);
    }
    /* ── 3번 방 ── */
    function renderRoom3(){
      const r=state.rooms[3];
      const practice=`<article class="card practice"><div class="eyebrow" style="color:#4C5A78">연습 스텝 · 점수 없음</div><h3 style="margin-top:6px">점선 동그라미 안 음의 음이름은?</h3><div class="staff-wrap small" style="max-width:360px;margin-top:10px">${staffSVG({key:'F',w:300,notes:[{p:2,mark:true}]})}</div><div class="choice-row">${['마','바','사','가'].map(c=>`<button class="choice" onclick="answerStaffPractice('${c}')">${c}</button>`).join('')}</div></article>`;
      const main=`<article class="card"><div style="display:flex;align-items:center;margin-bottom:12px"><span class="qno">!</span><h3>암호 벽의 가락을 계이름 번호로 읽으세요. ①~④가 비밀번호 순서입니다.</h3></div><div class="staff-wrap">${staffSVG({key:'F',labels:true,notes:[{p:1},{p:3},{p:5},{p:4}]})}</div></article>`;
      return roomShell(3,r.practiceDone?`<div class="explain" style="margin:0">연습 통과! 둘째 줄 음은 ‘사’. 이제 가락 전체를 읽어 보세요.</div>${main}`:practice+`<article class="card"><div class="locked-note">연습 스텝을 통과하면 암호 벽의 가락이 나타납니다.</div></article>`);
    }
    function answerStaffPractice(c){if(matches('p3:'+c)){state.rooms[3].practiceDone=true;save();toast('정답! 둘째 줄은 사입니다.','good');render()}else toast('아래에서부터 세어 보세요. 첫째 줄은 마, 첫째 칸은 바…','bad')}
    /* ── 4번 방 ── */
    function renderRoom4(){
      const r=state.rooms[4];
      const keys={A:'C',B:'G',C:'F'};
      const stage1=`<article class="card"><div style="display:flex;align-items:center"><span class="qno">1</span><h3>1단계 잠금 — 세 장의 오선 카드 중 <u>바장조</u>를 고르세요.</h3></div><p style="color:#5B6480;margin-top:4px">틀리면 1회당 −10점, 다시 고를 수 있어요.</p><div class="keycards">${state.keyOrder.map(id=>`<button class="keycard ${r.keyDone&&matches('k4:'+id)?'picked':''}" ${r.keyDone?'disabled':''} onclick="pickKey('${id}')"><div class="staff-wrap small">${staffSVG({key:keys[id],w:200,barline:true})}</div><strong>카드 ${id}</strong></button>`).join('')}</div>${r.keyDone?'<div class="explain">다장조는 조표 없음, 사장조는 ♯ 하나(올림바), 바장조는 ♭ 하나(내림나)!</div>':''}${r.keyWrong?`<p style="color:#B34A3F;margin-top:10px">조표 오답 ${r.keyWrong}회</p>`:''}</article>`;
      const stage2=r.keyDone?`<article class="card"><div style="display:flex;align-items:center;margin-bottom:12px"><span class="qno">2</span><h3>2단계 잠금 — 덧줄 음이 섞인 가락을 계이름 번호로 읽으세요.</h3></div><div class="staff-wrap">${staffSVG({key:'F',labels:true,notes:[{p:-2},{p:1},{p:3},{p:5}]})}</div></article>`:`<article class="card"><div class="locked-note">1단계를 풀면 2단계 가락이 나타납니다.</div></article>`;
      return roomShell(4,stage1+stage2);
    }
    function pickKey(id){const r=state.rooms[4];if(r.keyDone)return;if(matches('k4:'+id)){r.keyDone=true;save();toast('1단계 잠금 해제!','good');render()}else{r.keyWrong++;save();toast('바장조가 아닙니다. −10점. 조표를 다시 보세요.','bad');render()}}

    /* ── 결말·제출 ── */
    function buildPayload(){
      return {student:state.student,escaped:state.escaped,elapsedSeconds:elapsedSeconds(),
        rooms:[1,2,3,4].map(n=>{const r=state.rooms[n];return {reached:!!r.startedAt,cleared:!!r.clearedAt,wrong:r.wrong,hint1:!!r.hint1,hint2:r.hint2,keyWrong:r.keyWrong,wrongPins:r.wrongPins,seconds:r.startedAt?Math.round(((r.clearedAt||state.endedAt||Date.now())-r.startedAt)/1000):0}}),
        clientTotal:earned()+timeBonus()};
    }
    function startSend(){if(sendingNow)return;let payload=null;try{payload=JSON.parse(localStorage.getItem(PENDING_KEY)||'null')}catch(e){}if(!payload){payload=buildPayload();try{localStorage.setItem(PENDING_KEY,JSON.stringify(payload))}catch(e){}}sendPayload(payload)}
    async function sendPayload(payload){
      sendingNow=true;state.sendError='';save();render();
      if(!SUBMIT_URL.trim()){setTimeout(()=>handleResult(mockResult(payload)),700);return}
      try{
        const response=await fetch(SUBMIT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});
        const raw=await response.text();let result;
        try{result=JSON.parse(raw)}catch(e){throw new Error('서버 응답을 JSON으로 읽지 못했습니다.')}
        if(!response.ok)throw new Error(`전송 실패 (${response.status})`);
        if(!result||!result.ok)throw new Error(result&&result.error?result.error:'서버가 제출을 처리하지 못했습니다.');
        handleResult(result);
      }catch(error){sendingNow=false;state.sendError=(error&&error.message)||'전송에 실패했습니다.';save();render()}
    }
    function mockResult(p){return {ok:true,demo:true,attempt:1,total:p.clientTotal,timeBonus:timeBonus()}}
    function handleResult(result){sendingNow=false;try{localStorage.removeItem(PENDING_KEY)}catch(e){}state.result=result;state.sendError='';save();render()}
    function renderEnding(){
      const esc=state.escaped,res=state.result;
      if(!res&&!state.sendError&&!sendingNow)setTimeout(startSend,0);
      const total=res&&res.total!=null?res.total:earned()+timeBonus();
      const hero=esc
        ?`<div class="end-hero"><img src="${asset('ending.webp')}" alt="활짝 열린 금고에서 쏟아지는 빛"><div><div class="eyebrow">VAULT OPEN · ${escapeHtml(state.student.name)} 견학생</div><h1>으뜸음을 되찾았다!</h1>${maestro("금고 안에서 ‘바’ 음이 적힌 음표가 나왔습니다. <b>으뜸음 ‘바’가 돌아왔습니다. 바장조에서 바는 ‘도’.</b> 이제 음계가 다시 섭니다. 문이 열립니다!")}</div></div>`
        :`<div class="end-hero dark"><img src="${asset('title.webp')}" alt="불이 꺼진 연구소 복도"><div><div class="eyebrow">EMERGENCY POWER OFF · ${escapeHtml(state.student.name)} 견학생</div><h1>탈출 중단</h1>${maestro('비상 전원이 꺼지기 전에 여기까지의 기록을 저장했어요. 통과한 방의 점수가 기록됩니다.')}</div></div>`;
      const rooms=[1,2,3,4].map(n=>{const r=state.rooms[n];return `<div><span>${n}번 방</span><b style="color:${r.clearedAt?'var(--good)':'var(--muted)'}">${r.clearedAt?roomScore(n):'—'}</b></div>`}).join('');
      let send;
      if(res)send=res.demo?`<div class="send-box ok">목 모드 미리보기입니다. <code>SUBMIT_URL</code>을 넣으면 선생님 시트에 기록됩니다.</div>`:`<div class="send-box ok">✓ 선생님 시트에 기록되었습니다. (${res.attempt||1}차 제출)</div>`;
      else if(state.sendError)send=`<div class="send-box err"><b>기록을 보내지 못했습니다.</b> ${escapeHtml(state.sendError)}<div class="action-row" style="margin-top:10px"><button class="primary" onclick="retrySend()">다시 보내기</button></div><small style="color:var(--muted)">계속 실패하면 아래 ‘결과 이미지 저장’을 누르고 선생님께 보여 주세요. 기록은 이 기기에 보관되어 있습니다.</small></div>`;
      else send=`<div class="send-box"><span class="spinner"></span>선생님 시트로 기록을 보내는 중… 창을 닫지 마세요.</div>`;
      return layout(`<section class="ending-wrap"><div id="resultCard" class="result-card">${hero}<div class="result-body"><div class="score-big"><strong>${total}</strong><span>/ 450점 · ${escapeHtml(state.student.grade)}학년 ${escapeHtml(state.student.className)}반 ${escapeHtml(state.student.number)}번 ${escapeHtml(state.student.name)}</span></div><div class="score-grid">${rooms}<div><span>시간 보너스</span><b>+${res&&res.timeBonus!=null?res.timeBonus:timeBonus()}</b></div><div><span>소요 시간</span><b>${fmt(elapsedSeconds())}</b></div><div><span>탈출</span><b style="color:${esc?'var(--good)':'var(--bad)'}">${esc?'성공':'중단'}</b></div><div><span>오답 합계</span><b>${[1,2,3,4].reduce((s,n)=>s+state.rooms[n].wrong+state.rooms[n].keyWrong,0)}</b></div></div>${esc?`<div class="root-note"><div class="staff-wrap small">${staffSVG({key:'F',w:190,notes:[{p:1,fill:'#4C5A78'}]})}</div><p style="margin:0;line-height:1.6;color:var(--muted)">첫째 칸의 <b style="color:var(--lemon)">바</b> = 바장조의 <b style="color:var(--lemon)">도(1)</b></p></div>`:''}${send}</div></div><div class="action-row"><button class="primary" onclick="saveResultImage()">결과 이미지 저장</button></div></section>`);
    }
    function retrySend(){state.sendError='';save();startSend()}
    async function saveResultImage(){if(!window.html2canvas)return toast('이미지 저장 도구를 불러오지 못했습니다. 화면 캡처를 이용해 주세요.','bad');try{const canvas=await html2canvas(document.getElementById('resultCard'),{backgroundColor:'#141A28',scale:2,useCORS:true});const a=document.createElement('a');const s=state.student;a.download=`음악연구소탈출_${s.grade}-${s.className}_${s.number}_${s.name}.png`;a.href=canvas.toDataURL('image/png');a.click()}catch(e){toast('이미지 저장에 실패했습니다. 화면 캡처를 이용해 주세요.','bad')}}

    function render(){
      const fn={title:renderTitle,lobby:renderLobby,briefing:renderBriefing,room1:renderRoom1,room2:renderRoom2,room3:renderRoom3,room4:renderRoom4,ending:renderEnding}[state.scene]||renderTitle;
      document.getElementById('app').innerHTML=fn();
    }
    setInterval(()=>{
      const t=document.getElementById('timer');if(t&&state.startedAt&&!state.endedAt)t.textContent=timerText();
      const n=currentRoom();if(!n)return;const r=state.rooms[n];
      const left=document.getElementById('lockLeft');
      if(left){const s=Math.ceil((r.lockUntil-Date.now())/1000);if(s<=0)render();else left.textContent=s}
    },1000);
    window.addEventListener('keydown',e=>{
      if(!currentRoom()||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
      if(/^[0-9]$/.test(e.key))pressKey(e.key);else if(e.key==='Backspace')pressKey('⌫');else if(e.key==='Enter')tryUnlock();
    });
    render();
  </script>
</body>
</html>
